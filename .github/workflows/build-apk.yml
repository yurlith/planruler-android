name: Build test APK

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and release build
        run: |
          chmod +x gradlew
          ./gradlew test :app:assembleRelease --stacktrace --continue
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
      - name: Publish unsigned APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "planruler-${tag}-unsigned.apk"
          gh release create "$tag" "planruler-${tag}-unsigned.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Test build ${GITHUB_RUN_NUMBER} (${GITHUB_REF_NAME})" \
            --notes "Unsigned CI build of ${GITHUB_SHA}. Sign before installing."
