AutoName: PlanRuler
Summary: Measure plans and calculate materials offline
Description: |-
  PlanRuler is an offline-first work centre for installers who need practical
  measurements and material estimates without an engineering-style interface.

  Import PDF, PNG or JPEG plans, calibrate the scale and measure lengths,
  polylines, areas, perimeters and angles. Organise measurements by project,
  layer, material and template, then export results as CSV, JSON or annotated
  PDF.

  The workshop includes pipe and fabrication calculations, flange-offset
  geometry, cutting lengths, welding gaps, bolt-circle data and stock-cut
  planning. An optional local CRM stores clients and work orders on the device.

  The app has no cloud account, advertising, analytics or tracking SDK and does
  not request Internet access.

